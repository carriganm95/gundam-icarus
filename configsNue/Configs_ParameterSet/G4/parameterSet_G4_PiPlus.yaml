name: G4 PiPlus Reinteraction
isEnabled: true

printDialSetsSummary: true

allowPca: true

useEigenDecompInFit: true
allowEigenDecompWithBounds: true

# Fractional covariance from calc_geant4_covariance.py config_G4PiPlus_pionKE.json
# (2000 GEANT4 reinteraction universes, merged_g4_v31_flux.root events/g4)
covarianceMatrixFilePath: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSet/G4/outputs/output_CovMat_G4PiPlus_pionKE.root"
covarianceMatrixTMatrixD: "G4PiPlus_pionKE/G4PiPlus_pionKE_covariance"

# parameterLimits (minValue 0, maxValue 30) removed 2026-10-27: with
# useEigenDecompInFit GUNDAM reports "Undefined behavior: Using bounded
# parameters with eigendecomposition". Priors are 1 with widths of
# 0.07-12%, so the 0 bound is never approached. Restore these limits if
# eigen-decomposition is turned off.
# parameterLimits:
#   minValue: 0
#   maxValue: 30

useOnlyOneParameterPerEvent: true

dialSetDefinitions:
  - name: G4 PiPlus Reinteraction dialSetDefinitions
    applyOnDataSets: ["*"]
    parametersBinningPath: "${GUNDAM_CONFIG_DIR}/binnings/binning_G4PionKE.txt"
    printDialsSummary: true
    applyCondition: "[reco_is_data]==0"
